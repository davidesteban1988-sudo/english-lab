<title>English Lab de David</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@300;400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra superior fija + riel de niveles a la izquierda (escritorio) + área de trabajo; los ejercicios abren en una hoja enfocada encima. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --surface-2:#F5F7FC; --ink:#141A31; --muted:#58607E; --line:#D5DAE8;
  --accent:#E2552D; --accent-ink:#FFFFFF; --accent-soft:#FCE6DE;
  --good:#1B8553; --good-soft:#DCF1E5; --bad:#C0352B; --bad-soft:#F9E1DE; --warn:#A86C0B;
  --space:#161B3B; --star:#F3F0FF; --scrim:rgba(14,18,40,.55);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Lexend','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1122; --surface:#171B33; --surface-2:#1E2340; --ink:#E8EBF7; --muted:#9BA2C2; --line:#2B3153;
  --accent:#FF7650; --accent-ink:#1A0E08; --accent-soft:#3A2220;
  --good:#45C98B; --good-soft:#163527; --bad:#FF7468; --bad-soft:#3A1C1C; --warn:#E3A53C;
  --space:#0A0D24; --star:#F3F0FF; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1122; --surface:#171B33; --surface-2:#1E2340; --ink:#E8EBF7; --muted:#9BA2C2; --line:#2B3153;
  --accent:#FF7650; --accent-ink:#1A0E08; --accent-soft:#3A2220;
  --good:#45C98B; --good-soft:#163527; --bad:#FF7468; --bad-soft:#3A1C1C; --warn:#E3A53C;
  --space:#0A0D24; --star:#F3F0FF; --scrim:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:800}
.h3{font-size:1rem;font-weight:600;margin:18px 0 8px}
h4{font-size:.9rem;font-weight:600;margin:12px 0 6px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:500;margin-bottom:6px}
.eyebrow.light{color:rgba(255,255,255,.75)}
.row{display:flex;flex-wrap:wrap;align-items:center} .gap{gap:10px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7 0,var(--accent) 40%,#3a1208 100%);box-shadow:0 0 0 3px var(--accent-soft)}
.navs{display:flex;gap:4px;margin-left:8px}
.navb{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.navb.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.meter{display:flex;align-items:baseline;gap:4px;font-size:.8rem;color:var(--muted)} .meter b{color:var(--ink);font-size:.95rem}
.cl-dot{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.cl-dot.on{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)} .cl-dot.off{background:var(--warn)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
@media (max-width:480px){.top .meter{display:none}.navb{padding:6px 6px}}
@media (max-width:640px){.brand span:last-child{display:none}.top{gap:6px}.navs{margin-left:0;gap:2px;min-width:0}.navb{padding:6px 8px;font-size:.85rem}.meter small{display:none}.top-r{gap:8px}.icon-btn{width:34px;height:34px}}

/* shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1320px;margin:0 auto}
#rail{border-right:1px solid var(--line);min-width:0}
.rail-in{position:sticky;top:60px;max-height:calc(100vh - 60px);overflow:auto;padding:14px 10px 40px}
main{padding-block:22px 90px;padding-inline:16px;min-width:0;display:flex;flex-direction:column;gap:18px}
@media (min-width:1100px){main{padding-inline:28px}}
@media (max-width:920px){.shell{grid-template-columns:minmax(0,1fr)}#rail{display:none}}

/* rail */
details{margin-bottom:6px}
summary{list-style:none;display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r-sm);cursor:pointer;font-weight:600}
summary::-webkit-details-marker{display:none}
@media (hover:hover){summary:hover{background:var(--surface)}}
.lv-badge{font-family:var(--f-mono);font-size:.7rem;font-weight:700;color:#fff;background:var(--lv);padding:2px 7px;border-radius:6px}
.lv-name{flex:1;min-width:0} .lv-pc{font-size:.75rem;color:var(--muted)}
.nodes{list-style:none;margin:2px 0 8px;padding:0}
.node{width:100%;display:flex;align-items:center;gap:9px;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;font-size:.86rem}
@media (hover:hover){.node:hover{background:var(--surface)}}
.node.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--lv)}
.node .dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;border:1.5px solid var(--line);background:var(--surface)}
.node.done .dot{background:var(--lv);border-color:var(--lv);color:#fff}
.node.open .dot{border-color:var(--lv);color:var(--lv);font-weight:700}
.node.locked{color:var(--muted)} .node.locked .dot{font-size:.62rem;opacity:.75}
.node.exam .nm{font-weight:600}
.node .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .pc{font-size:.7rem;color:var(--muted)}

/* buttons */
.btn{border:1px solid transparent;border-radius:999px;padding:10px 18px;font-weight:500;display:inline-flex;align-items:center;gap:8px;line-height:1.2;transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.05)}}
.btn.ghost{background:var(--surface);border-color:var(--line)}
@media (hover:hover){.btn.ghost:hover{border-color:var(--muted)}}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.chip.on-dark{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#fff}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}

/* hero + unit head */
.hero,.unit-head{position:relative;border-radius:var(--r);overflow:hidden;color:#fff;min-height:170px;background:var(--space)}
.poster-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in,.uh-in{position:relative;padding:22px 22px 20px;max-width:70ch;display:flex;flex-direction:column;gap:8px}
.hero h1,.unit-head h1{color:#fff}
.hero-sub{color:rgba(255,255,255,.85)}
.unit-head .chips{display:flex;flex-wrap:wrap;gap:6px}
.uh-bar,.lv-bar{height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;max-width:360px}
.uh-bar i,.lv-bar i{display:block;height:100%;background:var(--lv)}
.lv-bar{background:var(--surface-2);max-width:none}

/* plan */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.step{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 16px 16px 58px;display:flex;flex-direction:column;gap:3px;min-height:84px}
@media (hover:hover){.step:hover:not(:disabled){border-color:var(--accent)}}
.step .k{position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-size:.85rem}
.step b{font-family:var(--f-display);font-size:1.02rem}
.step small{color:var(--muted)}
.step.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step.hot small{color:inherit;opacity:.85} .step.hot .k{background:rgba(255,255,255,.25)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-size:1.5rem;line-height:1.1} .stats small{color:var(--muted);font-size:.78rem}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* skills */
.skills{display:flex;flex-direction:column;gap:7px}
.sk{display:grid;grid-template-columns:110px minmax(0,1fr) 32px 16px;align-items:center;gap:10px;font-size:.86rem}
.sk-bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.sk-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sk em{font-style:normal;font-size:.8rem} .sk em.up{color:var(--good)} .sk em.down{color:var(--bad)}
.weak{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.weak li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;background:var(--bad-soft);border-radius:8px;font-size:.88rem}
.weak b{color:var(--bad)}

/* eval */
.eval header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.eval header small{color:var(--muted);margin-left:auto}
.pill{font-size:.78rem;padding:3px 10px;border-radius:99px;background:var(--surface-2);font-weight:600}
.pill.t-sube{background:var(--good-soft);color:var(--good)} .pill.t-baja{background:var(--bad-soft);color:var(--bad)}
.eval-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 18px}
.eval ul,.eval ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}

/* level map */
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:12px}
.lv-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.lv-h{display:flex;align-items:center;gap:8px} .lv-h b{flex:1;font-family:var(--f-display)} .lv-h .mono{font-size:.8rem;color:var(--muted)}
.dots{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.d{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.72rem;display:grid;place-items:center}
.d.done{background:var(--lv);border-color:var(--lv);color:#fff}
.d.open{border-color:var(--lv);color:var(--lv);font-weight:700;box-shadow:0 0 0 3px color-mix(in srgb,var(--lv) 25%,transparent)}
.d.locked{opacity:.45}
.d.exam{border-radius:50%}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.88rem;position:relative}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.locked{opacity:.55}
.tab .ck{font-style:normal;color:var(--good);font-weight:700} .tab.on .ck{color:inherit}
.tab .pc{font-style:normal;font-size:.72rem;color:var(--muted)} .tab.on .pc{color:inherit;opacity:.8}

/* station */
.station{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.st-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
.st-status{font-size:.85rem;color:var(--muted)}
.story{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.story li,.ex-list li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;transition:background .2s}
.story li.now{background:var(--accent-soft)}
.story .en{font-size:1.06rem;cursor:pointer} .story .es,.ex-list .es{color:var(--muted);font-size:.88rem}
.ex-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ex-list .en{font-weight:500}
.pattern{background:var(--surface-2);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flash{position:relative;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;min-height:130px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.flash .fe{font-size:2.1rem;line-height:1}
.flash .fw{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.flash .fb2{display:none;flex-direction:column;gap:4px;font-size:.85rem}
.flash .fb2 em{color:var(--muted);font-style:normal}
.flash.flipped .fe,.flash.flipped .fw{display:none} .flash.flipped .fb2{display:flex}
.flash .fs{position:absolute;top:6px;right:8px;font-size:.9rem;padding:2px}
.pairs{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.pairs li{display:flex;align-items:center;gap:6px;background:var(--surface-2);padding:6px 8px;border-radius:10px}
.vs{font-size:.75rem;color:var(--muted)}
.gen .wait{margin-top:10px}
.locked-view{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 18px}
.lock-ico{font-size:2.4rem}

/* chat */
.chat{display:flex;flex-direction:column;gap:12px;padding:16px}
.chat-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.msgs{min-height:260px;max-height:min(58vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.msg{max-width:min(78%,560px);padding:10px 14px;border-radius:16px;min-width:0;overflow-wrap:anywhere}
.msg.profe{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.profe .en{font-size:1.04rem}
.msg.profe .es{color:var(--muted);font-size:.88rem;margin-top:6px}
.msg .tools{display:flex;gap:6px;margin-top:8px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.me .fixes,.msg.me .better,.msg.me .clean{background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;margin-top:8px}
.msg.me .better{font-weight:500}
.msg.me .clean{font-size:.82rem;color:var(--good)}
.msg.sys{align-self:center;font-size:.82rem;color:var(--muted);background:none;padding:2px}
.typing{display:flex;gap:5px;padding:14px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;min-width:0}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
textarea:focus,select:focus{border-color:var(--accent);outline:none}
.mic{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.15rem;display:grid;place-items:center}
.mic.big{width:56px;height:56px;font-size:1.4rem}
.mic.live{background:var(--bad);border-color:var(--bad);animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.dict-hint{font-size:.82rem;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:8px 10px;border-radius:8px}
.hands{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.topic{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
@media (hover:hover){.topic:hover{border-color:var(--accent)}} .topic small{color:var(--muted)}
.fixes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.fixes .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px} .fixes .r{color:var(--good);font-weight:600} .fixes .arr{color:var(--muted)}

/* sheet / runner */
#sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.run{width:100%;max-width:680px;background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media (max-width:560px){#sheet{padding:0}.run{border-radius:0;min-height:100%}}
.run-top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.run .q{font-size:1.3rem}
.big{font-family:var(--f-display);font-size:1.35rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.emoji-big{font-size:3.2rem;line-height:1}
.es-line{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.92rem}
.es-line[data-hidden] span{filter:blur(5px);user-select:none}
.es-tog{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;font-size:.7rem;padding:1px 6px;font-family:var(--f-mono)}
.say-row{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:1rem}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans-row{display:flex;gap:10px;align-items:flex-start}
.built{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built .ph{color:var(--muted);font-size:.85rem}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:.98rem}
.tile:disabled{opacity:.3}
.tile.on{background:var(--accent-soft);border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile.matched{background:var(--good-soft);border-color:var(--good);opacity:1}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match>div{display:flex;flex-direction:column;gap:6px}
.match .tile{text-align:left}
.fb .ok,.fb .no{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb .ok{background:var(--good-soft)} .fb .ok>b{color:var(--good)}
.fb .no{background:var(--bad-soft)} .fb .no>b{color:var(--bad)}
.right-ans{font-weight:600;font-size:1.05rem}
.es-small{color:var(--muted);font-size:.85rem}
.marks{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.92rem}
.mk-ok{color:var(--good)} .mk-no{color:var(--bad);text-decoration:underline wavy}
.wait{color:var(--muted);font-style:italic}
.run-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.score{display:flex;align-items:baseline;gap:12px}
.score .mono{font-size:3rem;font-weight:700;color:var(--good)} .score.low .mono{color:var(--bad)}
.result-msg{font-size:1.02rem}
.wrong-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.wrong-list li{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.settings .fld{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0}
.settings legend{margin-bottom:6px}
.radio{display:flex;gap:8px;align-items:center;font-size:.92rem}
.danger{border-top:1px solid var(--line);padding-top:12px}


/* guía de inicio */
.guide{border:2px solid var(--accent);display:flex;flex-direction:column;gap:10px}
.gsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:16px}
.gsteps li{max-width:75ch}
.gsteps li>b:first-child{display:block;margin-bottom:4px}
.gsteps li>.row,.gsteps li>textarea,.gsteps li>.sound-out,.gsteps li>#soundHelp,.gsteps li>#micOut{margin-top:10px}
.gsteps li::marker{font-family:var(--f-mono);font-weight:700;color:var(--accent)}
kbd{font-family:var(--f-mono);font-size:.8em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface-2)}
.sound-out{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.sound-out .ok{color:var(--good)} .sound-out .no{color:var(--bad)}
.ok-line{color:var(--good);font-weight:500}
.warn-line{font-size:.9rem;color:var(--ink);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:10px 12px;border-radius:10px}
.guide-line{font-size:.92rem;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.guide-line b{font-family:var(--f-mono);color:var(--accent)}

.dict-btn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;min-height:56px;border-radius:14px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:1.25rem}
.dict-btn span{font-size:.72rem;font-weight:600}
.dict-hint ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.dict-hint{color:var(--ink);text-align:left}
.dict-hint.flash{animation:flashh 1.2s}
@keyframes flashh{0%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;max-width:min(92vw,520px);font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
